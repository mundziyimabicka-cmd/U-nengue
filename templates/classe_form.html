{% extends "base.html" %}
{% block title %}{{ 'Modifier' if room else 'Créer' }} une classe{% endblock %}
{% block content %}
<div class="page-header">
    <h2>{{ 'Modifier' if room else 'Créer' }} une classe</h2>
    <a href="{{ url_for('classes') }}" class="btn btn-outline">← Retour</a>
</div>
<div class="card" style="max-width:500px">
<form method="POST">
    <div class="form-group">
        <label>Nom de la classe *</label>
        <input type="text" name="name" class="form-control" required value="{{ room.name if room else '' }}" placeholder="ex. 3ème année A">
    </div>
    <div class="form-group">
        <label>Niveau *</label>
        <select name="level" class="form-control" required>
            {% for n in NIVEAUX %}
            <option value="{{ n }}" {% if room and room.level == n %}selected{% endif %}>{{ n }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Enseignant(e)</label>
        <input type="text" name="teacher" class="form-control" value="{{ room.teacher if room else '' }}">
    </div>
    <button type="submit" class="btn btn-primary">Enregistrer</button>
</form>
</div>
{% endblock %}
