{% extends "base.html" %}
{% block title %}Fiche rituel{% endblock %}
{% block content %}
<div class="page-header">
    <h2>{{ 'Modifier' if sheet else 'Nouveau' }} commentaire de rituel</h2>
    <a class="btn btn-secondary" href="{{ url_for('fiches_rituels') }}">← Retour</a>
</div>
<form method="POST" class="card" style="max-width:800px;border-top:5px solid #c026d3">
    <div class="form-row">
        <div class="form-group">
            <label>Classe</label>
            <select name="class_id" class="form-control">
                {% for r in rooms %}
                <option value="{{ r.id }}" {% if sheet and sheet.class_id==r.id %}selected{% endif %}>{{ r.name }} — {{ r.level }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" class="form-control" value="{{ sheet.date.isoformat() if sheet and sheet.date else '' }}">
        </div>
        <div class="form-group">
            <label>Temps / Durée *</label>
            <input type="text" name="duration" class="form-control" required
                   value="{{ sheet.duration if sheet else '' }}" placeholder="ex. 07h45 – 08h05 (20 min)">
        </div>
    </div>
    <div class="form-group">
        <label>Titre du rituel *</label>
        <input type="text" name="title" class="form-control" required value="{{ sheet.title if sheet else '' }}"
               placeholder="ex. Rituel de date / Comptage du jour">
    </div>
    <div class="form-group">
        <label>Objectif *</label>
        <textarea name="objective" class="form-control" rows="2" required placeholder="Ce que les élèves doivent réussir">{{ sheet.objective if sheet else '' }}</textarea>
    </div>
    <div class="form-row">
        <div class="form-group">
            <label>Rôle de l'enseignant *</label>
            <textarea name="teacher_role" class="form-control" rows="5" required placeholder="Ce que fait / dit l'enseignant">{{ sheet.teacher_role if sheet else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>Rôle de l'élève *</label>
            <textarea name="student_role" class="form-control" rows="5" required placeholder="Ce que font les élèves">{{ sheet.student_role if sheet else '' }}</textarea>
        </div>
    </div>
    <div class="form-group">
        <label>Notes / observations</label>
        <textarea name="notes" class="form-control" rows="2">{{ sheet.notes if sheet else '' }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">💾 Enregistrer et télécharger le PDF</button>
</form>
{% endblock %}
