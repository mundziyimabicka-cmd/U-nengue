{% extends "base.html" %}
{% block title %}Exercices yipunu{% endblock %}
{% block content %}
<div class="page-header" style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:space-between;align-items:center">
    <h2 style="margin:0">✏️ Exercices</h2>
    <a class="btn btn-secondary" href="{{ url_for('ipunu') }}">← Ipunu</a>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem">
{% for e in exercices %}
<a href="{{ url_for('ipunu_exercice_detail', eid=e.id) }}" class="card" style="text-decoration:none;border-top:5px solid #ea580c">
    <span class="badge badge-info">{{ e.niveau }}</span>
    <span class="badge" style="background:#ffedd5;color:#c2410c">{{ e.type }}</span>
    <h3 style="margin:0.5rem 0;color:#9a3412">{{ e.id }}. {{ e.titre }}</h3>
    <p style="margin:0;font-size:0.9rem;color:#6b7280">{{ e.consigne }}</p>
    <p style="margin:0.4rem 0 0;font-size:0.8rem;color:#ea580c">{{ e.questions|length }} question(s)</p>
</a>
{% endfor %}
</div>
{% endblock %}
