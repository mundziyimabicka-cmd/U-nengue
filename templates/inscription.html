{% extends "base.html" %}
{% block title %}Créer un compte U nengue{% endblock %}
{% block content %}
<div style="max-width:520px;margin:1.5rem auto">
  <div class="card" style="border-top:5px solid #a21caf">
    <h2 style="margin:0 0 0.35rem;color:#86198f">Créer mon compte U nengue</h2>
    <p style="color:#6b7280;margin:0 0 1rem">Chaque école a sa propre base de données, vide et prête à l'emploi.</p>
    <form method="POST">
      <div class="form-group">
        <label>Nom de l'école *</label>
        <input type="text" name="school_name" class="form-control" required placeholder="Ex. École Publique de Mouila">
      </div>
      <div class="form-group">
        <label>Votre nom complet (directeur / responsable) *</label>
        <input type="text" name="full_name" class="form-control" required>
      </div>
      <div class="form-group">
        <label>Identifiant de connexion *</label>
        <input type="text" name="username" class="form-control" required autocomplete="username" pattern="[a-zA-Z0-9._-]{3,40}" title="Lettres, chiffres, . _ -">
      </div>
      <div class="form-group">
        <label>Mot de passe * (6 caractères min.)</label>
        <input type="password" name="password" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>Confirmer le mot de passe *</label>
        <input type="password" name="password2" class="form-control" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label>E-mail</label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="text" name="phone" class="form-control">
      </div>
      <div class="form-group">
        <label>Province</label>
        <input type="text" name="province" class="form-control" placeholder="Ex. Ngounié">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Créer mon compte école</button>
    </form>
    <p style="margin:1rem 0 0;text-align:center">
      <a href="{{ url_for('login') }}">Déjà un compte ? Se connecter</a>
    </p>
  </div>
</div>
{% endblock %}
