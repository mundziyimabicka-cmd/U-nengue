{% extends "base.html" %}
{% block title %}Bulletins{% endblock %}
{% block content %}
<div class="page-header"><h2>📄 Bulletins d'évaluation</h2></div>
<div class="card" style="margin-bottom:1.25rem">
    <form method="GET" style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:end">
        <div class="form-group" style="margin:0">
            <label>Classe</label>
            <select name="class_id" class="form-control" onchange="this.form.submit()">
                {% for r in rooms %}
                <option value="{{ r.id }}" {% if selected and selected.id == r.id %}selected{% endif %}>{{ r.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-group" style="margin:0">
            <label>Palier</label>
            <select name="palier" class="form-control" onchange="this.form.submit()">
                {% for p in PALIERS %}<option value="{{ p }}" {% if palier == p %}selected{% endif %}>{{ p }}</option>{% endfor %}
            </select>
        </div>
    </form>
</div>
{% if selected %}
<div class="card">
    <div class="table-wrap">
        <table>
            <thead><tr><th>Élève</th><th>Actions</th></tr></thead>
            <tbody>
            {% for s in students %}
            <tr>
                <td><strong>{{ s.full_name }}</strong></td>
                <td class="btn-group">
                    <a href="{{ url_for('bulletin', student_id=s.id, palier=palier) }}" class="btn btn-info btn-sm">Voir bulletin</a>
                    <a href="{{ url_for('bulletin_pdf', student_id=s.id) }}" class="btn btn-primary btn-sm">Bulletin PDF</a>
                </td>
            </tr>
            {% else %}
            <tr><td colspan="2" style="text-align:center;padding:2rem">Aucun élève</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endif %}
{% endblock %}
