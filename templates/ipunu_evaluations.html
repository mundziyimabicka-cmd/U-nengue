{% extends "base.html" %}
{% block title %}Évaluations yipunu{% endblock %}
{% block content %}
<div class="page-header" style="display:flex;flex-wrap:wrap;gap:0.75rem;justify-content:space-between;align-items:center">
    <h2 style="margin:0">✅ Évaluations</h2>
    <a class="btn btn-secondary" href="{{ url_for('ipunu') }}">← Ipunu</a>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1rem">
{% for e in evaluations %}
<a href="{{ url_for('ipunu_evaluation_detail', eid=e.id) }}" class="card" style="text-decoration:none;border-top:5px solid #dc2626">
    <span class="badge badge-danger">{{ e.niveau }}</span>
    <h3 style="margin:0.5rem 0;color:#991b1b">{{ e.titre }}</h3>
    <p style="margin:0;font-size:0.9rem;color:#6b7280">Durée : {{ e.duree }} · {{ e.questions|length }} questions</p>
</a>
{% endfor %}
</div>
{% endblock %}
